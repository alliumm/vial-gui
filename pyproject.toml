[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vial-gui"
version = "0.7.5"
dependencies = [
    "altgraph==0.17",
    "future==0.18.2",
    "hid>=1.0.8",
    "keyboard==0.13.5",
    "macholib==1.14",
    "pefile==2019.4.18",
    "PyQt5==5.9.2",
    "simpleeval==1.0.8",
    "sip==4.19.8",
    "pywin32==303; sys_platform == 'win32'",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-xvfb==3.1.1",
]

[project.gui-scripts]
vial = "vial.main:main"

[tool.setuptools.package-dir]
vial = "src/main/python"

[tool.setuptools.package-data]
vial = ["resources/Icon.ico", "resources/qmk_settings.json"]
