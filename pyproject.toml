[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vial-gui"
version = "0.7.5"
dependencies = [
    "altgraph==0.17.5",
    "hid==1.0.9",
    "keyboard==0.13.5",
    "macholib==1.16.4",
    "pefile==2024.8.26",
    "PyQt6==6.11.0",
    "pywin32==312; sys_platform == 'win32'",
    "simpleeval==1.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-xvfb==3.1.1",
]

[project.gui-scripts]
vial = "vial.main:main"

[tool.setuptools.package-dir]
vial = "src/main/python"

[tool.setuptools.package-data]
vial = ["resources/Icon.ico", "resources/qmk_settings.json"]
